<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#355e44">
<title>方圆十李的工作台🍐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
/* ============ 设计系统 · 雅致书卷 · 暖梨绿 ============ */
:root{
  --bg:#f3efe6; --bg-2:#fbf9f3; --bg-3:#ffffff;
  --ink:#262b27; --ink-2:#4a524c; --ink-3:#7d8479;
  --jade:#4a7c59; --jade-d:#355e44; --jade-l:#e7f0e9;
  --pear:#9bc24a; --pear-d:#7ba033; --pear-l:#eef6dd;
  --amber:#d9a441; --amber-l:#fbf0d8;
  --clay:#c8553d; --clay-l:#f6e3dd;
  --indigo:#3d5a80; --indigo-l:#e2e8f0;
  --line:#e6e0d2; --line-2:#d8d0bd;
  --shadow:0 2px 14px rgba(60,70,55,.08); --shadow-d:0 8px 30px rgba(60,70,55,.16);
  --r:16px; --r-s:10px; --r-l:22px;
  --ff-d:'Noto Serif SC',serif; --ff-b:'Noto Sans SC',sans-serif; --ff-e:'Cormorant Garamond',serif;
  --sp:max(14px,calc((100vw - 460px)/2));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--ff-b); color:var(--ink); background:var(--bg);
  background-image:radial-gradient(circle at 12% 8%,rgba(155,194,74,.10),transparent 40%),radial-gradient(circle at 90% 92%,rgba(74,124,89,.08),transparent 45%);
  min-height:100vh; line-height:1.55; font-size:15px; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:6px}
.empty-state{padding:36px 16px;text-align:center;color:var(--ink-3)}
.empty-state .ic{font-size:34px;margin-bottom:8px;opacity:.6}
.empty-state p{margin:4px 0;font-size:13px}

/* ============ 顶部 ============ */
.app-header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--jade-d),var(--jade));color:#fff;box-shadow:0 4px 20px rgba(53,94,68,.28)}
.hdr-top{display:flex;align-items:center;gap:10px;padding:11px var(--sp) 9px}
.hdr-title{font-family:var(--ff-d);font-weight:900;font-size:19px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title .pear{display:inline-block;transform:translateY(1px)}
.class-chip{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:30px;font-size:13px;font-weight:500;max-width:42vw;overflow:hidden}
.class-chip .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.14);flex-shrink:0;font-size:18px}
.icon-btn:active{background:rgba(255,255,255,.28)}
.spacer{flex:1}

/* 金句区 */
.quote-wrap{padding:0 var(--sp) 12px}
.quote-card{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);padding:12px 14px;backdrop-filter:blur(6px);position:relative;overflow:hidden}
.quote-card::before{content:'"';position:absolute;left:8px;top:-12px;font-family:var(--ff-e);font-size:60px;color:rgba(255,255,255,.14);font-style:italic}
.quote-zh{font-family:var(--ff-d);font-size:15px;font-weight:500;line-height:1.5;position:relative}
.quote-en{font-family:var(--ff-e);font-size:14px;font-style:italic;color:rgba(255,255,255,.78);margin-top:4px;line-height:1.4;position:relative}
.quote-cat{position:absolute;right:10px;top:9px;font-size:10px;background:var(--pear-d);color:#fff;padding:2px 7px;border-radius:20px;font-weight:700;letter-spacing:.5px}
.dt-row{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:rgba(255,255,255,.7);position:relative}
.dt-row .dot{width:5px;height:5px;border-radius:50%;background:var(--pear)}

/* ============ 主区 ============ */
.view{padding:14px var(--sp) 24px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.mod-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mod-head h2{font-family:var(--ff-d);font-size:20px;font-weight:900;margin:0;display:flex;align-items:center;gap:7px}
.mod-head .sub{font-size:12px;color:var(--ink-3);font-weight:400;font-family:var(--ff-b)}
.mod-head .bar{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);margin:0 10px}

/* 卡片 */
.card{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.card.tint-j{background:linear-gradient(135deg,var(--jade-l),var(--bg-3))}
.card.tint-p{background:linear-gradient(135deg,var(--pear-l),var(--bg-3))}
.card.tint-a{background:linear-gradient(135deg,var(--amber-l),var(--bg-3))}
.card-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;margin-bottom:10px;color:var(--jade-d)}
.card-h .ic{font-size:18px}

/* 网格 */
.grid{display:grid;gap:10px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.stat{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;position:relative;overflow:hidden}
.stat .lab{font-size:11px;color:var(--ink-3);font-weight:500}
.stat .num{font-family:var(--ff-d);font-size:26px;font-weight:900;line-height:1.1;margin-top:3px;color:var(--jade-d)}
.stat .delta{font-size:11px;margin-top:2px}
.stat .delta.up{color:var(--jade)} .stat .delta.dn{color:var(--clay)} .stat .delta.neutral{color:var(--ink-3)}
.stat .mini-ic{position:absolute;right:8px;top:8px;font-size:18px;opacity:.5}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 15px;border-radius:30px;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn-pri{background:var(--jade);color:#fff;box-shadow:0 3px 12px rgba(74,124,89,.3)}
.btn-pear{background:var(--pear-d);color:#fff}
.btn-out{border:1.5px solid var(--jade);color:var(--jade-d);background:var(--bg-3)}
.btn-ghost{background:var(--line);color:var(--ink-2)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-block{width:100%}
.btn-danger{background:var(--clay);color:#fff}
.fab{position:fixed;right:18px;bottom:88px;width:54px;height:54px;border-radius:50%;background:var(--jade);color:#fff;font-size:26px;box-shadow:0 6px 20px rgba(74,124,89,.45);z-index:30;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.92)}

/* 快捷入口 */
.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qi{background:var(--bg-3);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 6px;text-align:center;transition:.15s}
.qi:active{transform:scale(.95);background:var(--jade-l)}
.qi .ic{font-size:22px;display:block;margin-bottom:4px}
.qi .tx{font-size:11px;color:var(--ink-2);font-weight:500}

/* 列表行 */
.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:600;font-size:14px}
.row .meta{font-size:11px;color:var(--ink-3);margin-top:1px}
.row .act{display:flex;gap:6px}

/* 标签 */
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.tag.crit{background:var(--clay-l);color:var(--clay)}
.tag.poor{background:#e7e0f0;color:#6b4a8f}
.tag.single{background:#fde8e8;color:#b85454}
.tag.gift{background:var(--amber-l);color:#9a6f1d}
.tag.psych{background:#e0eef0;color:#2f6b78}
.tag.lag{background:#f6e6d8;color:#a6622d}
.tag.gen{background:var(--jade-l);color:var(--jade-d)}
.tag.pear{background:var(--pear-l);color:var(--pear-d)}

/* 表单 */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line-2);border-radius:var(--r-s);background:var(--bg-2);transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px var(--jade-l)}
.fld textarea{resize:vertical;min-height:70px}
.chip-group{display:flex;flex-wrap:wrap;gap:6px}
.chip-opt{padding:6px 12px;border-radius:20px;border:1.5px solid var(--line-2);font-size:12px;font-weight:600;color:var(--ink-2);background:var(--bg-2)}
.chip-opt.on{background:var(--jade);color:#fff;border-color:var(--jade)}

/* 模态 */
.modal-mask{position:fixed;inset:0;background:rgba(40,45,40,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--bg-2);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:90vh;overflow-y:auto;animation:up .3s cubic-bezier(.2,.8,.2,1);padding:8px 16px 30px}
.sheet .grip{width:38px;height:4px;border-radius:4px;background:var(--line-2);margin:6px auto 10px}
.sheet h3{font-family:var(--ff-d);font-size:18px;margin:6px 0 12px;display:flex;align-items:center;gap:7px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.modal-center{align-items:center}
.modal-center .sheet{border-radius:22px;max-height:80vh}

/* 抽屉导航 */
.drawer-mask{position:fixed;inset:0;background:rgba(30,35,30,.45);z-index:55;opacity:0;pointer-events:none;transition:.25s}
.drawer-mask.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:330px;background:var(--bg-2);z-index:56;transform:translateX(-105%);transition:.3s cubic-bezier(.3,.8,.2,1);overflow-y:auto;box-shadow:6px 0 30px rgba(0,0,0,.18)}
.drawer.open{transform:none}
.drawer-h{background:linear-gradient(135deg,var(--jade-d),var(--jade));color:#fff;padding:18px 16px}
.drawer-h .tt{font-family:var(--ff-d);font-weight:900;font-size:17px}
.drawer-h .ds{font-size:12px;opacity:.8;margin-top:2px}
.nav-l1{font-family:var(--ff-d);font-weight:700;font-size:13px;color:var(--ink-3);padding:14px 16px 6px;letter-spacing:1px;text-transform:uppercase}
.nav-l2{padding:6px 16px}
.nav-l2 .grp{font-size:12px;color:var(--jade);font-weight:700;margin:8px 0 4px;display:flex;align-items:center;gap:5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-s);font-size:14px;font-weight:500;color:var(--ink-2);transition:.12s}
.nav-item:active,.nav-item.active{background:var(--jade-l);color:var(--jade-d)}
.nav-item .ic{width:24px;text-align:center;font-size:17px}
.nav-item .badge{margin-left:auto;background:var(--clay);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px}

/* 底部Tab */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(251,249,243,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;z-index:45;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;color:var(--ink-3);font-size:10.5px;font-weight:500}
.tab .ic{font-size:20px}
.tab.active{color:var(--jade-d)}
.tab.active .ic{transform:translateY(-1px)}

/* 课表 */
.schedule{display:grid;grid-template-columns:40px repeat(7,1fr);gap:3px;font-size:11px}
.sch-h{font-weight:700;text-align:center;padding:6px 2px;background:var(--jade-d);color:#fff;border-radius:6px;font-size:10px}
.sch-time{font-size:9px;color:var(--ink-3);text-align:center;padding:5px 0;writing-mode:initial}
.sch-cell{min-height:48px;border-radius:6px;padding:4px 3px;text-align:center;display:flex;flex-direction:column;justify-content:center;background:var(--bg-2);border:1px solid var(--line);font-size:10px;cursor:pointer}
.sch-cell.has{background:var(--pear-l);border-color:var(--pear)}
.sch-cell .sj{font-weight:700;color:var(--jade-d);font-size:10.5px;line-height:1.15}
.sch-cell .tc{font-size:8.5px;color:var(--ink-3);margin-top:1px}
.sch-cell.empty{color:var(--ink-3);opacity:.5}
.sj-语文{background:#e7f0e9!important}.sj-数学{background:#e2e8f0!important}.sj-英语{background:#fbf0d8!important}
.sj-物理{background:#f6e3dd!important}.sj-化学{background:#fde8e8!important}.sj-生物{background:#e0eef0!important}
.sj-政治{background:#efe7f0!important}.sj-历史{background:#f6e6d8!important}.sj-地理{background:#eef6dd!important}
.sj-体育{background:#e7f0e9!important}.sj-音乐{background:#fbf0d8!important}.sj-美术{background:#f6e3dd!important}.sj-班会{background:#e2e8f0!important}

/* 座位 */
.seat-grid{display:grid;gap:5px;padding:8px 0}
.seat{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border:1.5px dashed var(--line-2);font-size:11px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s;text-align:center;padding:2px}
.seat.filled{background:var(--pear-l);border:1.5px solid var(--pear);border-style:solid;color:var(--jade-d)}
.seat.empty-h{background:transparent;border:none}
.seat podium{background:var(--jade-d);color:#fff;border-style:solid}
.seat:active{transform:scale(.93)}
.board{background:var(--jade-d);color:#fff;text-align:center;padding:7px;border-radius:8px;font-size:12px;font-weight:700;margin-bottom:8px;letter-spacing:2px}

/* 图表 */
.chart-box{position:relative}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:11px;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* 进度条 */
.bar-track{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:8px;transition:.4s}
.progress-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.progress-row .lab{flex-shrink:0;width:60px;font-size:12px;font-weight:600}
.progress-row .track{flex:1}
.progress-row .val{flex-shrink:0;width:42px;text-align:right;font-size:12px;font-weight:700;color:var(--jade-d)}

/* 时间轴 */
.timeline{position:relative;padding-left:22px}
.timeline::before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line-2)}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:'';position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--bg-3);border:3px solid var(--jade)}
.tl-item .dt{font-size:11px;color:var(--ink-3);font-weight:600}
.tl-item .tt{font-size:14px;font-weight:600;margin:1px 0}
.tl-item .ds{font-size:12px;color:var(--ink-2);background:var(--bg-2);padding:7px 10px;border-radius:var(--r-s);margin-top:3px;border:1px solid var(--line)}
.tl-cat{display:inline-block;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700;margin-left:6px}

/* 待办 */
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:11px;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:8px}
.todo-item.done{opacity:.55}
.todo-item.done .tt{text-decoration:line-through}
.chk{width:20px;height:20px;border-radius:6px;border:2px solid var(--line-2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.chk.on{background:var(--jade);border-color:var(--jade)}
.pri-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:6px}
.pri-高{background:var(--clay)} .pri-中{background:var(--amber)} .pri-低{background:var(--jade)}

/* 段标题 */
.sec-t{font-family:var(--ff-d);font-size:14px;font-weight:700;color:var(--jade-d);margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec-t::before{content:'';width:4px;height:15px;background:var(--pear);border-radius:3px}
.flex{display:flex} .flex-c{display:flex;align-items:center} .gap{gap:8px} .gap-s{gap:5px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .mb{margin-bottom:10px} .mt{margin-top:10px} .tac{text-align:center} .small{font-size:12px} .xs{font-size:11px} .muted{color:var(--ink-3)} .bold{font-weight:700} .scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch} .nowrap{white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:480px}
.tbl th{background:var(--jade-d);color:#fff;padding:9px 8px;text-align:left;font-weight:600;font-size:12px;position:sticky;top:0}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl tr:nth-child(even) td{background:var(--bg-2)}
.tbl tr:active td{background:var(--jade-l)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600}
.search-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-bar input{flex:1;padding:10px 14px;border:1.5px solid var(--line-2);border-radius:30px;background:var(--bg-2)}
.filter-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.filter-chips .chip-opt{white-space:nowrap}
.score-pill{font-weight:800;font-family:var(--ff-d)}
.notice{background:var(--amber-l);border-left:3px solid var(--amber);padding:9px 12px;border-radius:var(--r-s);font-size:12px;color:#8a6420;margin-bottom:10px}
</style>
</head>
<body>

<!-- 顶部 -->
<header class="app-header">
  <div class="hdr-top">
    <button class="icon-btn" id="btnDrawer" aria-label="导航">☰</button>
    <div class="hdr-title">方圆十李的工作台<span class="pear">🍐</span></div>
    <div class="spacer"></div>
    <button class="class-chip" id="btnClass"><span>🏫</span><span class="nm" id="curClassName">初三(2)班</span><span>▾</span></button>
  </div>
  <div class="quote-wrap">
    <div class="quote-card">
      <span class="quote-cat" id="qCat">励志</span>
      <div class="quote-zh" id="qZh">载入中…</div>
      <div class="quote-en" id="qEn">Loading…</div>
      <div class="dt-row"><span class="dot"></span><span id="dtText">—</span></div>
    </div>
  </div>
</header>

<!-- 抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-h">
    <div class="tt">方圆十李的工作台 🍐</div>
    <div class="ds">班主任 · 智能数据管家</div>
  </div>
  <div id="navTree"></div>
</aside>

<!-- 主视图 -->
<main id="appMain"></main>

<!-- 悬浮新增 -->
<button class="fab" id="fab" style="display:none">＋</button>

<!-- 底部Tab -->
<nav class="tabbar" id="tabbar">
  <div class="tab active" data-tab="home"><span class="ic">📅</span>首页</div>
  <div class="tab" data-tab="dashboard"><span class="ic">📊</span>仪表盘</div>
  <div class="tab" data-tab="students"><span class="ic">👥</span>学生</div>

function download(name,content,type='text/plain;charset=utf-8'){

function exportWord(filename,innerHtml,title='文档'){

  const html=head+innerHtml+'</body></html>';
  download(filename,'\ufeff'+html,'application/msword');
}
/* CSV导出 */
function exportCSV(filename,rows){
  const csv=rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(',')).join('\n');

function makeDefaultSchedule(){
  const days=['周一','周二','周三','周四','周五'];
  const periods=[['08:00','08:45'],['08:55','09:40'],['10:00','10:45'],['11:00','11:45'],['14:00','14:45'],['14:55','15:40'],['16:00','16:45'],['17:00','17:45']];
  const grid={days,periods,cells:{}};
  const sample=[
    ['语文','数学','英语','物理','语文'],['数学','语文','数学','英语','化学'],['英语','物理','语文','数学','政治'],
    ['物理','化学','英语','语文','数学'],['体育','政治','历史','体育','英语'],['音乐','生物','地理','美术','历史'],
    ['班会','自习','自习','自习','自习'],['自习','自习','自习','自习','自习']
  ];
  const teachers={语文:'王老师',数学:'张老师',英语:'刘老师',物理:'陈老师',化学:'赵老师',政治:'黄老师',历史:'周老师',生物:'吴老师',地理:'郑老师',体育:'孙老师',音乐:'马老师',美术:'胡老师',班会:'李老师',自习:'自习'};
  sample.forEach((row,pi)=>row.forEach((sj,di)=>{
    grid.cells[`${pi}_${di}`]={subject:sj,teacher:teachers[sj]||''};
  }));
  return grid;
}

function viewGrades(){
  const exams=DB.exams[cid()]||[];
  let h=modHead('📈','成绩分析',`${exams.length}场考试 · ${curClass().name}`);
  h+=`<div class="flex gap wrap mb">
    <button class="btn btn-pri btn-sm" onclick="examAdd()">＋ 新建考试</button>
    <button class="btn btn-out btn-sm" onclick="gradeInput()">录入成绩</button>
    <button class="btn btn-pear btn-sm" onclick="gradeAnalysis()">生成学情分析</button>
  </div>`;
  if(!exams.length){h+=emptyHtml('暂无考试','点击"新建考试"开始');return h}
  const latest=exams[exams.length-1];
  h+=`<div class="card"><div class="card-h"><span class="ic">📋</span>考试列表</div>`;
  exams.forEach((e,i)=>{
    h+=`<div class="row"><div class="main"><div class="nm" style="font-size:13px">${esc(e.name)} <span class="xs muted">${e.date}</span></div><div class="meta">${e.subjects.join(' · ')}</div></div>
    <button class="btn btn-sm btn-ghost" onclick="examDel('${e.id}')">删除</button></div>`;
  });
  h+=`</div>`;
  // 最新考试统计
  const g=DB.grades[latest.id]||{};const st=colAll('students').filter(s=>g[s.id]);
  if(st.length){
    const subs=latest.subjects;
    const avg={};subs.forEach(sj=>avg[sj]=Math.round(st.reduce((a,s)=>a+(g[s.id][sj]||0),0)/st.length));
    const totals=st.map(s=>({id:s.id,name:s.name,t:subs.reduce((a,sj)=>a+(g[s.id][sj]||0),0)})).sort((a,b)=>b.t-a.t);
    const max=totals[0].t,min=totals[totals.length-1].t;
    h+=`<div class="card tint-j"><div class="card-h"><span class="ic">📊</span>${esc(latest.name)} · 班级概览</div>
    <div class="grid g2"><div class="stat"><div class="lab">参考人数</div><div class="num">${st.length}</div></div>
    <div class="stat"><div class="lab">平均总分</div><div class="num">${Math.round(totals.reduce((a,x)=>a+x.t,0)/st.length)}</div></div>
    <div class="stat"><div class="lab">最高分</div><div class="num" style="color:var(--jade)">${max}</div></div>
    <div class="stat"><div class="lab">最低分</div><div class="num" style="color:var(--clay)">${min}</div></div></div></div>`;
    // 各科平均
    h+=`<div class="card"><div class="card-h"><span class="ic">📈</span>各科平均分</div>`;
    subs.forEach(sj=>{
      h+=`<div class="progress-row"><span class="lab">${sj}</span><div class="track"><div class="bar-fill" style="width:${avg[sj]}%;background:var(--jade)"></div></div><span class="val">${avg[sj]}</span></div>`;
    });
    h+=`</div>`;
    // 分层
    const top=Math.ceil(st.length*0.2),midSt=totals.slice(Math.floor(st.length*0.55),Math.ceil(st.length*0.65));
    h+=`<div class="card"><div class="card-h"><span class="ic">🏆</span>分层人数</div>
    <div class="grid g3"><div class="stat tint-p"><div class="lab">尖子生(前20%)</div><div class="num">${top}</div></div>
    <div class="stat tint-a"><div class="lab">临界生(55%-65%)</div><div class="num">${midSt.length}</div></div>
    <div class="stat tint-j"><div class="lab">后进生</div><div class="num">${st.length-top-midSt.length}</div></div></div></div>`;
    // 排名表
    h+=`<div class="card"><div class="card-h"><span class="ic">🏅</span>班级排名</div><div class="scroll-x"><table class="tbl"><tr><th>名次</th><th>姓名</th><th>总分</th>${subs.map(s=>`<th>${s}</th>`).join('')}</tr>`;
    totals.forEach((x,i)=>{h+=`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td><b>${x.t}</b></td>${subs.map(sj=>`<td>${g[x.id][sj]||'-'}</td>`).join('')}</tr>`});
    h+=`</table></div></div>`;
  }
  return h;
}
function viewGradesAfter(){}
function examAdd(){
  openSheet('新建考试',`
    <div class="fld"><label>考试名称</label><input id="exN" placeholder="如期中考试"></div>
    <div class="fld"><label>日期</label><input type="date" id="exD" value="${todayStr()}"></div>
    <div class="fld"><label>科目（逗号分隔）</label><input id="exS" value="语文,数学,英语,物理,化学,政治,历史"></div>

function examSave(){
  const name=$('#exN').value.trim();if(!name){toast('请输入名称','err');return}
  const subjects=$('#exS').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);
  const e={id:uid(),name,date:$('#exD').value,subjects};
  DB.exams[cid()]=DB.exams[cid()]||[];DB.exams[cid()].push(e);DB.grades[e.id]={};
  saveDB();closeSheet();render();toast('考试已创建');
}
function examDel(id){confirmBox('删除该考试及成绩？',()=>{DB.exams[cid()]=DB.exams[cid()].filter(e=>e.id!==id);delete DB.grades[id];saveDB();render();toast('已删除')})}
function gradeInput(){
  const exams=DB.exams[cid()]||[];if(!exams.length){toast('请先新建考试','err');return}
  const opts=exams.map((e,i)=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  openSheet('录入成绩',`
    <div class="fld"><label>选择考试</label><select id="giExam">${opts}</select></div>
    <p class="small muted">下方为每位学生该考试各科分数，可直接修改后保存。</p>
    <div id="giTable"></div>
    <button class="btn btn-pri btn-block mt" onclick="gradeSave()">保存全部</button>`);
  renderGradeInput(exams[exams.length-1].id);
}
function renderGradeInput(eid){
  const e=DB.exams[cid()].find(x=>x.id===eid);if(!e)return;
  const st=colAll('students');DB.grades[eid]=DB.grades[eid]||{};
  let h=`<div class="scroll-x"><table class="tbl"><tr><th>姓名</th>${e.subjects.map(s=>`<th>${s}</th>`).join('')}</tr>`;
  st.forEach(s=>{DB.grades[eid][s.id]=DB.grades[eid][s.id]||{};h+=`<tr><td>${esc(s.name)}</td>${e.subjects.map(sj=>`<td><input type="number" style="width:48px;padding:4px;border:1px solid var(--line);border-radius:5px" value="${DB.grades[eid][s.id][sj]??''}" data-sid="${s.id}" data-sj="${sj}"></td>`).join('')}</tr>`});
  h+=`</table></div>`;
  $('#giTable').innerHTML=h;
  $('#giExam').onchange=()=>renderGradeInput($('#giExam').value);
}
function gradeSave(){
  const eid=$('#giExam').value;
  $$('#giTable input').forEach(inp=>{const sid=inp.dataset.sid,sj=inp.dataset.sj;const v=inp.value;if(v!=='')DB.grades[eid][sid][sj]=+v});
  saveDB();closeSheet();render();toast('成绩已保存');
}
function gradeAnalysis(){
  const exams=DB.exams[cid()]||[];if(!exams.length){toast('请先录入成绩','err');return}
  const e=exams[exams.length-1];const g=DB.grades[e.id]||{};const st=colAll('students').filter(s=>g[s.id]);
  if(!st.length){toast('无成绩数据','err');return}
  const subs=e.subjects;
  const avg={};subs.forEach(sj=>avg[sj]=st.reduce((a,s)=>a+(g[s.id][sj]||0),0)/st.length);
  const totals=st.map(s=>({id:s.id,name:s.name,t:subs.reduce((a,sj)=>a+(g[s.id][sj]||0),0)})).sort((a,b)=>b.t-a.t);
  const clsAvg=totals.reduce((a,x)=>a+x.t,0)/st.length;
  // 进退步
  let trendText='本次为首次考试，暂无对比数据。';
  if(exams.length>=2){
    const prev=exams[exams.length-2];const gp=DB.grades[prev.id]||{};
    const prevTotals=st.filter(s=>gp[s.id]).map(s=>({id:s.id,name:s.name,t:subs.reduce((a,sj)=>a+(gp[s.id][sj]||0),0)})).sort((a,b)=>b.t-a.t);
    const prevRank={};prevTotals.forEach((x,i)=>prevRank[x.id]=i+1);
    const curRank={};totals.forEach((x,i)=>curRank[x.id]=i+1);
    const down=[];const up=[];
    st.forEach(s=>{if(prevRank[s.id]&&curRank[s.id]){const d=prevRank[s.id]-curRank[s.id];if(d>=10)up.push(s.name);if(d<=-10)down.push(s.name)}});
    trendText=down.length?`成绩下滑明显（名次下降≥10名）：${down.join('、')}。`:'无明显下滑学生。';
    trendText+=up.length?` 进步显著（名次上升≥10名）：${up.join('、')}。`:'';
  }
  const top=Math.ceil(st.length*0.2),midSt=totals.slice(Math.floor(st.length*0.55),Math.ceil(st.length*0.65));
  let html=`<h1>${esc(curClass().name)}${esc(e.name)}学情分析报告</h1>`;
  html+=`<p>一、整体情况：本次考试参考${st.length}人，班级平均总分${Math.round(clsAvg)}分，最高${totals[0].t}分（${esc(totals[0].name)}），最低${totals[totals.length-1].t}分。</p>`;
  html+=`<p>二、各科平均分：${subs.map(sj=>`${sj}${Math.round(avg[sj])}分`).join('、')}。</p>`;
  html+=`<p>三、分层情况：尖子生（前20%）${top}人，临界生（55%-65%）${midSt.length}人，后进生${st.length-top-midSt.length}人。</p>`;
  html+=`<p>四、进退步分析：${trendText}</p>`;
  html+=`<p>五、教学建议：针对薄弱学科加强基础训练；对临界生制定个性化提升方案；对下滑学生及时谈话了解原因并家校协同。</p>`;
  exportWord(`${curClass().name}_${e.name}_学情分析.doc`,html,'学情分析');
  toast('学情分析已导出');
}

/* ============ 违纪统计 ============ */
function viewDiscipline(){
  const disc=colAll('discipline').slice().sort((a,b)=>b.date.localeCompare(a.date));
  let h=modHead('⚠️','违纪统计',`${disc.length}条 · ${curClass().name}`);

  // 类型统计
  const byType={};disc.forEach(d=>byType[d.type]=(byType[d.type]||0)+1);
  h+=`<div class="card"><div class="card-h"><span class="ic">📊</span>类型分布</div>${pieChart(byType)}</div>`;
  // 近7日趋势
  const trend={};for(let i=6;i>=0;i--){const d=daysAgo(i);trend[d]=disc.filter(x=>x.date===d).length}
  h+=`<div class="card"><div class="card-h"><span class="ic">📉</span>近7日趋势</div>${barChart(trend,'违规次数')}</div>`;
  // 明细
  h+=`<div class="card"><div class="card-h"><span class="ic">📋</span>明细记录</div>`;
  disc.forEach(d=>{const s=studentName(d.studentId);
    h+=`<div class="row"><div class="main"><div class="nm" style="font-size:13px">${esc(s)} · ${esc(d.type)} <span class="pill" style="background:${d.level==='严重'?'var(--clay-l)':d.level==='一般'?'var(--amber-l)':'var(--jade-l)'};color:${d.level==='严重'?'var(--clay)':d.level==='一般'?'#9a6f1d':'var(--jade-d)'}">${esc(d.level)}</span></div><div class="meta">${d.date} · ${esc(d.handle)} ${esc(d.desc)}</div></div>

  h+=`</div>`;
  return h;
}

/* ============ 请假管理 ============ */
let leaveStep=1,leaveData={};
function viewLeave(){
  const lv=colAll('leave').slice().sort((a,b)=>b.start.localeCompare(a.start));
  let h=modHead('🏩','请假管理',`${lv.length}条 · ${curClass().name}`);
  // 统计
  if(lv.length){
    const byType={};lv.forEach(x=>byType[x.type]=(byType[x.type]||0)+1);
    h+=`<div class="card"><div class="card-h"><span class="ic">📊</span>请假类型</div>${pieChart(byType)}</div>`;
  }
  h+=`<div class="card"><div class="card-h"><span class="ic">📋</span>请假记录</div>`;
  if(!lv.length)h+=`<p class="muted small">暂无记录，点击右下角＋登记</p>`;
  lv.forEach(x=>{const s=studentName(x.studentId);
    h+=`<div class="row"><div class="main"><div class="nm" style="font-size:13px">${esc(s)} · ${esc(x.type)} <span class="tag gen">${esc(x.status)}</span></div><div class="meta">${x.start}~${x.end} (${x.days}天) · ${esc(x.reason)}</div></div>
    <button class="btn btn-sm btn-pear" onclick="leaveExport('${x.id}')">请假条</button>
    <button class="btn btn-sm btn-ghost" onclick="leaveDel('${x.id}')">删</button></div>`});
  h+=`</div>`;
  return h;
}
function viewLeaveAfter(){}
function leaveDel(id){confirmBox('删除该请假记录？',()=>{delCol('leave',id);saveDB();render();toast('已删除')})}
function leaveAdd(){
  leaveStep=1;leaveData={start:todayStr(),end:todayStr(),days:1,status:'已批准'};
  const st=colAll('students');
  openSheet('请假登记（四步）',`<div id="lvSteps"></div>`);
  renderLeaveStep();
}
function renderLeaveStep(){
  const st=colAll('students');
  const opts=st.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  let body='';
  if(leaveStep===1){
    body=`<div class="notice">第1步 / 选择学生</div><div class="fld"><label>学生</label><select id="lvS">${opts}</select></div>`;
  }else if(leaveStep===2){
    body=`<div class="notice">第2步 / 请假类型</div><div class="fld"><select id="lvT"><option>病假</option><option>事假</option><option>其他</option></select></div>`;
  }else if(leaveStep===3){
    body=`<div class="notice">第3步 / 请假时间</div>
    <div class="grid g2"><div class="fld"><label>开始</label><input type="date" id="lvS0" value="${leaveData.start}"></div>
    <div class="fld"><label>结束</label><input type="date" id="lvE" value="${leaveData.end}"></div></div>
    <div class="fld"><label>天数</label><input type="number" id="lvDays" value="${leaveData.days}"></div>`;
  }else{
    body=`<div class="notice">第4步 / 原因与审批</div>
    <div class="fld"><label>请假原因</label><textarea id="lvR" placeholder="如 感冒发烧"></textarea></div>
    <div class="fld"><label>审批人</label><input id="lvA" value="${curClass().headTeacher||'班主任'}"></div>
    <div class="fld"><label>状态</label><select id="lvSt"><option>已批准</option><option>待审批</option><option>已驳回</option></select></div>`;
  }
  let btns=`<div class="flex gap mt">`;
  if(leaveStep>1)btns+=`<button class="btn btn-ghost" onclick="leavePrev()">上一步</button>`;
  if(leaveStep<4)btns+=`<button class="btn btn-pri" style="flex:1" onclick="leaveNext()">下一步</button>`;
  else btns+=`<button class="btn btn-pear" style="flex:1" onclick="leaveSave()">完成登记</button>`;
  btns+=`</div>`;
  $('.sheet').innerHTML=`<div class="grip"></div><h3>请假登记 · 第${leaveStep}步</h3>${body}${btns}`;
}
function leaveNext(){
  if(leaveStep===1)leaveData.studentId=$('#lvS').value;
  if(leaveStep===2)leaveData.type=$('#lvT').value;
  if(leaveStep===3){leaveData.start=$('#lvS0').value;leaveData.end=$('#lvE').value;leaveData.days=+$('#lvDays').value||1}
  leaveStep++;renderLeaveStep();
}
function leavePrev(){leaveStep--;renderLeaveStep()}
function leaveSave(){
  leaveData.reason=$('#lvR').value.trim();leaveData.approver=$('#lvA').value.trim();leaveData.status=$('#lvSt').value;
  col('leave').push({id:uid(),...leaveData});
  saveDB();closeSheet();render();toast('请假已登记');
}
function leaveExport(id){
  const x=colAll('leave').find(l=>l.id===id);if(!x)return;
  const s=colAll('students').find(st=>st.id===x.studentId);
  const html=`<h1>学 生 请 假 条</h1>
  <p>班级：${esc(curClass().name)}</p>
  <p>姓名：${esc(s?s.name:'')}</p>
  <p>请假类型：${esc(x.type)}</p>
  <p>请假时间：${x.start} 至 ${x.end}，共 ${x.days} 天</p>
  <p>请假原因：${esc(x.reason)}</p>
  <p>监护人电话：${esc(s?s.phone:'')}</p>
  <br><p>审批人：${esc(x.approver)}　　状态：${esc(x.status)}</p>
  <br><p style="text-align:right">${new Date().toLocaleDateString('zh-CN')}</p>`;
  exportWord(`${s?s.name:'学生'}_请假条.doc`,html,'请假条');toast('请假条已导出');
}

function viewWork(){
  const wk=colAll('work').slice().sort((a,b)=>b.date.localeCompare(a.date));

    <button class="btn btn-pear btn-sm" onclick="workAutoPingyu()">生成期末操行评语</button>

  </div>`;
  if(!wk.length){h+=emptyHtml('暂无工作记录','点击右下角＋添加');return h}

function workCatColor(t){return {'班会':'#4a7c59','家校沟通':'#3d5a80','计划':'#9bc24a','总结':'#d9a441','报告':'#c8553d','其他':'#7d8479'}[t]||'#7d8479'}

function workDel(id){confirmBox('删除该记录？',()=>{delCol('work',id);saveDB();render();toast('已删除')})}
function workExportOne(id){

function workExportAll(){
  const wk=colAll('work');if(!wk.length){toast('无记录','err');return}
  let html=`<h1>${esc(curClass().name)}工作留痕汇总</h1>`;
  wk.forEach(x=>{html+=`<h2>${esc(x.title)}（${esc(x.type)} ${x.date}）</h2><p>${esc(x.desc).replace(/\n/g,'<br>')}</p>`});
  exportWord(`${curClass().name}_工作留痕汇总.doc`,html,'工作留痕');toast('已导出');

function workAutoPingyu(){
  const st=colAll('students');if(!st.length){toast('无学生数据','err');return}
  const exams=DB.exams[cid()]||[];
  let html=`<h1>${esc(curClass().name)}期末操行评语</h1>`;
  st.forEach(s=>{
    const dyns=s.dynamics||[];const pos=dyns.filter(d=>d.score>0).length,neg=dyns.filter(d=>d.score<0).length;
    let gradeAvg='';if(exams.length){const g=DB.grades[exams[exams.length-1].id]&&DB.grades[exams[exams.length-1].id][s.id];if(g){const t=Object.values(g).reduce((a,b)=>a+b,0);gradeAvg=`本学期各科平均成绩${Math.round(t/(Object.keys(g).length))}分`}}
    let txt=`${esc(s.name)}同学：本学期你在校表现${pos>neg?'积极向上':'有待加强'}，${pos?`共获得正面记录${pos}次`:''}${neg?`，需改进记录${neg}次`:''}。`;
    if(s.tags&&s.tags.includes('特长生'))txt+='你在特长方面表现突出，望继续发挥优势。';
    if(s.tags&&s.tags.includes('临界生'))txt+='学习处于临界状态，需更加努力突破瓶颈。';
    if(s.tags&&s.tags.includes('学困生'))txt+='学习基础较薄弱，建议夯实基础、勤问多练。';
    if(neg>pos)txt+='希望今后严格要求自己，遵守纪律，端正学习态度。';
    else txt+='希望你保持良好状态，再接再厉，争取更大进步。';
    if(gradeAvg)txt+=gradeAvg+'。';
    txt+='班主任寄语：用数据看见成长，用行动书写未来。';
    html+=`<p><b>${esc(s.name)}：</b>${txt}</p>`;
  });
  exportWord(`${curClass().name}_期末操行评语.doc`,html,'操行评语');toast('评语已生成');
}

let seatRows=6,seatCols=7;
function viewSeating(){
  let h=modHead('🪑','座位管理',`${curClass().name}`);
  const st=colAll('students');
  const layout=DB.seating[cid()]||{rows:6,cols:7,map:{}};
  seatRows=layout.rows;seatCols=layout.cols;
  h+=`<div class="flex gap wrap mb">
    <button class="btn btn-out btn-sm" onclick="seatAuto()">自动排座</button>
    <button class="btn btn-out btn-sm" onclick="seatConfig()">行列设置</button>
    <button class="btn btn-pear btn-sm" onclick="seatExportImg()">导出图片</button>
  </div>`;
  h+=`<div class="card"><div class="board">📚 讲 台</div><div class="seat-grid" id="seatGrid" style="grid-template-columns:repeat(${seatCols},1fr)"></div>
  <p class="xs muted mt">点击空位安排学生，点击已坐位可移除或调换。</p></div>`;
  return h;
}
function viewSeatingAfter(){renderSeats()}
function renderSeats(){
  const grid=$('#seatGrid');if(!grid)return;
  const layout=DB.seating[cid()]||{rows:seatRows,cols:seatCols,map:{}};
  const st=colAll('students');
  const seated={};Object.entries(layout.map).forEach(([k,sid])=>seated[sid]=k);
  let html='';
  for(let r=0;r<layout.rows;r++){
    for(let c=0;c<layout.cols;c++){
      const k=`${r}_${c}`;const sid=layout.map[k];
      const s=sid?st.find(x=>x.id===sid):null;
      if(s)html+=`<div class="seat filled" onclick="seatEdit('${k}')">${esc(s.name)}</div>`;
      else html+=`<div class="seat" onclick="seatEdit('${k}')">空</div>`;
    }
  }
  grid.innerHTML=html;
}
function seatConfig(){
  const layout=DB.seating[cid()]||{rows:6,cols:7,map:{}};
  openSheet('行列设置',`
    <div class="grid g2"><div class="fld"><label>行数</label><input type="number" id="sr" value="${layout.rows}"></div>
    <div class="fld"><label>列数</label><input type="number" id="sc" value="${layout.cols}"></div></div>
    <button class="btn btn-pri btn-block" onclick="seatSaveCfg()">保存</button>`);
}
function seatSaveCfg(){DB.seating[cid()]={rows:+$('#sr').value||6,cols:+$('#sc').value||7,map:(DB.seating[cid()]||{}).map||{}};saveDB();closeSheet();render();renderSeats();toast('已保存')}
function seatEdit(k){
  const layout=DB.seating[cid()]||{rows:seatRows,cols:seatCols,map:{}};
  const cur=layout.map[k];
  const st=colAll('students');
  const seated=new Set(Object.values(layout.map));
  const avail=st.filter(s=>!seated.has(s.id)||s.id===cur);
  let items=avail.map(s=>`<div class="row" onclick="seatPlace('${k}','${s.id}')"><div class="av" style="background:${s.id===cur?'var(--jade)':'var(--line-2)'}">${s.name[0]}</div><div class="main"><div class="nm" style="font-size:13px">${esc(s.name)}</div></div></div>`).join('');
  items+=`<div class="row" onclick="seatClear('${k}')"><div class="av" style="background:var(--clay-l);color:var(--clay)">✕</div><div class="main"><div class="nm" style="font-size:13px">移除当前座位</div></div></div>`;
  openSheet('安排座位',items);
}
function seatPlace(k,sid){DB.seating[cid()]||(DB.seating[cid()]={rows:seatRows,cols:seatCols,map:{}});DB.seating[cid()].map=DB.seating[cid()].map||{};Object.keys(DB.seating[cid()].map).forEach(kk=>{if(DB.seating[cid()].map[kk]===sid)delete DB.seating[cid()].map[kk]});DB.seating[cid()].map[k]=sid;saveDB();closeSheet();renderSeats()}
function seatClear(k){if(DB.seating[cid()]&&DB.seating[cid()].map)delete DB.seating[cid()].map[k];saveDB();closeSheet();renderSeats()}
function seatAuto(){
  const st=colAll('students');const layout=DB.seating[cid()]||{rows:6,cols:7,map:{}};
  layout.map={};let i=0;
  for(let r=0;r<layout.rows&&i<st.length;r++)for(let c=0;c<layout.cols&&i<st.length;c++){layout.map[`${r}_${c}`]=st[i].id;i++}
  DB.seating[cid()]=layout;saveDB();renderSeats();toast('已自动排座');
}
function seatExportImg(){
  const layout=DB.seating[cid()]||{rows:6,cols:7,map:{}};
  const st=colAll('students');
  const cw=90,ch=64,gap=8;
  const w=layout.cols*(cw+gap)+40,h=layout.rows*(ch+gap)+90;
  let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" style="background:#fbf9f3"><rect width="100%" height="100%" fill="#fbf9f3"/><text x="${w/2}" y="32" text-anchor="middle" font-family="Noto Sans SC" font-size="18" font-weight="700" fill="#355e44">${esc(curClass().name)} 座位表</text><rect x="40" y="48" width="${w-80}" height="26" rx="6" fill="#355e44"/><text x="${w/2}" y="66" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#fff">讲 台</text>`;
  for(let r=0;r<layout.rows;r++)for(let c=0;c<layout.cols;c++){const k=`${r}_${c}`;const sid=layout.map[k];const s=sid?st.find(x=>x.id===sid):null;const x=40+c*(cw+gap),y=86+r*(ch+gap);
    svg+=`<rect x="${x}" y="${y}" width="${cw}" height="${ch}" rx="8" fill="${s?'#eef6dd':'#fff'}" stroke="${s?'#9bc24a':'#d8d0bd'}" stroke-width="1.5"/><text x="${x+cw/2}" y="${y+ch/2+5}" text-anchor="middle" font-family="Noto Sans SC" font-size="13" fill="#355e44">${s?esc(s.name):''}</text>`}
  svg+=`</svg>`;
  download(`${curClass().name}_座位表.svg`,svg,'image/svg+xml');toast('已导出SVG');
}

  let txt=`${esc(s.guardian||'家长')}您好，我是${esc(curClass().name)}班主任。关于${esc(s.name)}近期情况向您反馈：${gtxt}日常表现方面，${pos.length?`正面记录${pos.length}次（如${pos.slice(0,2).map(d=>d.type).join('、')}）`:''}${neg.length?`，需关注${neg.length}次（如${neg.slice(0,2).map(d=>d.type).join('、')}）`:''}。希望我们家校携手，共同帮助孩子进步。如有疑问欢迎随时沟通。`;

/* ============ 待办备忘 ============ */
function viewTodo(){
  const todos=DB.todos.slice().sort((a,b)=>(a.done-b.done)||(a.due||'').localeCompare(b.due||''));
  const pend=todos.filter(t=>!t.done),done=todos.filter(t=>t.done);
  let h=modHead('✓','待办备忘',`${pend.length}项待办`);
  const wkEnd=daysAgo(-7);
  const focus=pend.filter(t=>!t.due||t.due<=wkEnd);
  if(focus.length){
    h+=`<div class="card tint-a"><div class="card-h"><span class="ic">🔥</span>近期聚焦</div>`;
    focus.slice(0,5).forEach(t=>{
      const over=t.due&&t.due<todayStr();
      h+=`<div class="row"><div class="pri-dot pri-${t.pri||'中'}"></div><div class="main"><div class="nm" style="font-size:13px">${esc(t.text)}</div><div class="meta">${t.cat||'其他'} · ${t.due?('截止 '+t.due):'无截止'} ${over?'<span style="color:var(--clay)">逾期</span>':''}</div></div></div>`;
    });
    h+=`</div>`;
  }
  h+=pendingHtml(pend)+doneHtml(done);
  return h;
}
function pendingHtml(pend){
  let h=`<div class="sec-t">待办清单 (${pend.length})</div>`;
  if(!pend.length)h+=emptyHtml('太棒了，暂无待办','点击右下角＋添加');
  pend.forEach(t=>{
    const over=t.due&&t.due<todayStr();
    h+=`<div class="todo-item"><div class="chk" onclick="todoToggle('${t.id}')"></div><div class="pri-dot pri-${t.pri||'中'}"></div><div class="main" style="flex:1"><div class="tt">${esc(t.text)}</div><div class="meta">${t.cat||'其他'} · ${t.due?('截止 '+t.due):'无截止'} ${over?'· <span style="color:var(--clay)">逾期</span>':''}</div></div><button class="btn btn-sm btn-ghost" onclick="todoEdit('${t.id}')">编辑</button></div>`;
  });
  return h;
}
function doneHtml(done){
  if(!done.length)return '';
  let h=`<div class="sec-t">已完成 (${done.length})</div>`;
  done.forEach(t=>{
    h+=`<div class="todo-item done"><div class="chk on" onclick="todoToggle('${t.id}')">✓</div><div class="main" style="flex:1"><div class="tt">${esc(t.text)}</div><div class="meta">${t.cat||'其他'}${t.due?' · '+t.due:''}</div></div><button class="btn btn-sm btn-ghost" onclick="todoDel('${t.id}')">删</button></div>`;
  });
  return h;
}

/* ============ 图表（内联SVG） ============ */
const CHART_COLORS=['#4a7c59','#9bc24a','#d9a441','#c8553d','#3d5a80','#6b4a8f','#2f6b78','#a6622d','#b85454','#7d8479'];
function pieChart(data){
  const entries=Object.entries(data).filter(([k,v])=>v>0);
  if(!entries.length)return '<p class="muted small">暂无数据</p>';
  const total=entries.reduce((a,[,v])=>a+v,0);
  const R=58,CX=68,CY=68;
  let acc=0,paths='',legend='';
  entries.forEach(([k,v],i)=>{
    const a0=acc/total*Math.PI*2-Math.PI/2, a1=(acc+v)/total*Math.PI*2-Math.PI/2;acc+=v;
    const x0=CX+R*Math.cos(a0),y0=CY+R*Math.sin(a0),x1=CX+R*Math.cos(a1),y1=CY+R*Math.sin(a1);
    const large=(a1-a0)>Math.PI?1:0;
    const col=CHART_COLORS[i%CHART_COLORS.length];
    paths+=`<path d="M${CX},${CY} L${x0.toFixed(1)},${y0.toFixed(1)} A${R},${R} 0 ${large} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" fill="${col}" opacity=".92"/>`;
    legend+=`<span><i style="background:${col}"></i>${esc(k)} ${v}</span>`;
  });
  return `<div class="chart-box" style="text-align:center"><svg width="136" height="136" viewBox="0 0 136 136">${paths}<circle cx="${CX}" cy="${CY}" r="26" fill="#fff"/><text x="${CX}" y="${CY-3}" text-anchor="middle" font-size="18" font-weight="800" fill="#355e44" font-family="Noto Serif SC">${total}</text><text x="${CX}" y="${CY+13}" text-anchor="middle" font-size="9" fill="#7d8479">总计</text></svg><div class="legend">${legend}</div></div>`;
}
function barChart(data,label){
  const entries=Object.entries(data);
  if(!entries.length)return '<p class="muted small">暂无数据</p>';
  const max=Math.max(...entries.map(([,v])=>v),1);
  const W=300,H=120,pad=24,bw=(W-pad*2)/entries.length*0.6,gap=(W-pad*2)/entries.length;
  let bars='',axis='';
  entries.forEach(([k,v],i)=>{
    const bh=v/max*(H-pad*2);const x=pad+i*gap+gap*0.2;const y=H-pad-bh;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${v>0?'#4a7c59':'#e6e0d2'}"/>`;
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="10" fill="#355e44" font-weight="700">${v}</text>`;
    const lbl=k.slice(5);
    axis+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9" fill="#7d8479">${lbl}</text>`;
  });
  return `<div class="chart-box" style="overflow-x:auto"><svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${bars}<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#d8d0bd"/>${axis}</svg></div>`;
}
